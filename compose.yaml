services:
  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_VERSION:?set MEDIAMTX_VERSION in .env}-ffmpeg # -ffmpeg variant: needed by the Telegram and archive hooks
    container_name: mediamtx
    restart: unless-stopped
    network_mode: host # recommended by MediaMTX; keeps the ZowieBox's real source IP
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - /etc/localtime:/etc/localtime:ro # archive file names in the Pi's local time
      - type: bind
        source: /mnt/stream-archive # USB stick mount point (see fstab)
        target: /recordings
        bind:
          propagation: rslave # see the stick even if it is mounted after the container starts
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: "${ZOWIEBOX_PUBLISH_PASSWORD:?}"
      MTX_PATHDEFAULTS_FORWARD_0_DEST: "rtmps://a.rtmps.youtube.com/live2#${YOUTUBE_STREAM_KEY:?}"
      MTX_PATHDEFAULTS_FORWARD_1_DEST: "rtmps://live-api-s.facebook.com:443/rtmp#${FACEBOOK_STREAM_KEY:?}"
      # Telegram is pushed by the runOnOnline ffmpeg hook (see mediamtx.yml), not by forward
      TELEGRAM_RTMP_URL: "${TELEGRAM_SERVER_URL:?}${TELEGRAM_STREAM_KEY:?}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Uploads finished archive files to Google Drive (or any rclone remote) on a schedule.
  # supercronic runs `rclone copy` from archive-sync/crontab; see archive-sync/Dockerfile.
  archive-sync:
    build:
      context: ./archive-sync
      args:
        RCLONE_VERSION: ${RCLONE_VERSION:?set RCLONE_VERSION in .env}
    image: mediamtx-relay/archive-sync:${RCLONE_VERSION}
    pull_policy: build # local image: build it, never try to pull it
    container_name: archive-sync
    restart: unless-stopped
    environment:
      RCLONE_DESTINATION: ${RCLONE_DESTINATION:?set RCLONE_DESTINATION in .env}
      RCLONE_MIN_AGE: 10m   # skip the file MediaMTX is still writing (its mtime keeps changing)
      RCLONE_BWLIMIT: 256k  # ~2 Mbit/s, so uploads never compete with a live stream
      RCLONE_LOG_LEVEL: INFO
    volumes:
      - ./archive-sync/crontab:/etc/crontab:ro
      - ./rclone:/config/rclone # rclone.conf (git-ignored); writable so OAuth tokens can refresh
      - /etc/localtime:/etc/localtime:ro
      - type: bind
        source: /mnt/stream-archive # mount point; stream-audio/ inside exists only on the USB stick
        target: /archive
        read_only: true
        bind:
          propagation: rslave # see the stick even if it is mounted after the container starts
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
