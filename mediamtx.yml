# MediaMTX: LAN ingest for the ZowieBox, routed to YouTube, Facebook, Telegram and an
# audio-only archive on a USB stick. Stream keys are NOT in this file; they are injected
# as MTX_* / TELEGRAM_* environment variables (see compose.yaml).

logLevel: info

# Ingest is RTMP only; disable every other server so nothing else binds on the host.
rtmp: true
rtsp: false
hls: false
webrtc: false
srt: false
moq: false

# Control API on the Pi's loopback only (host networking).
api: true
apiAddress: 127.0.0.1:9997

authMethod: internal
authInternalUsers:
  # The ZowieBox may publish to the mode paths: correct credentials AND a LAN source address.
  # The password is injected as MTX_AUTHINTERNALUSERS_0_PASS (index 0 = this entry; keep it first).
  - user: zowie
    pass:
    ips: ["192.168.10.0/24"]
    permissions:
      - action: publish
        path: live/main
      - action: publish
        path: live/youtube-telegram
      - action: publish
        path: live/archive-only
  # Local only: the mode paths publish into the output paths, the hooks read from them,
  # and local tooling (curl, ffprobe) may read and use the API.
  - user: any
    pass:
    ips: ["127.0.0.1/32", "::1/128"]
    permissions:
      - action: publish
        path: youtube
      - action: publish
        path: facebook
      - action: publish
        path: telegram
      - action: publish
        path: archive
      - action: read
      - action: api

paths:
  # ---------------------------------------------------------------------------
  # Modes: the ZowieBox picks one with its stream key (main, youtube-telegram,
  # archive-only). Each mode is just a list of local output paths to feed.
  # ---------------------------------------------------------------------------
  live/main:
    forward:
      - dest: rtmp://127.0.0.1:1935/youtube
      - dest: rtmp://127.0.0.1:1935/facebook
      - dest: rtmp://127.0.0.1:1935/telegram
      - dest: rtmp://127.0.0.1:1935/archive

  live/youtube-telegram:
    forward:
      - dest: rtmp://127.0.0.1:1935/youtube
      - dest: rtmp://127.0.0.1:1935/telegram
      - dest: rtmp://127.0.0.1:1935/archive

  live/archive-only:
    forward:
      - dest: rtmp://127.0.0.1:1935/archive

  # ---------------------------------------------------------------------------
  # Outputs: one path per destination, each defined once.
  # ---------------------------------------------------------------------------

  # Native forward. The destination (with key) is injected as MTX_PATHS_YOUTUBE_FORWARD_0_DEST.
  # Keep "forward: []": an empty path entry makes MediaMTX's env override panic (v1.21.2).
  youtube:
    forward: []

  # Native forward. The destination (with key) is injected as MTX_PATHS_FACEBOOK_FORWARD_0_DEST.
  facebook:
    forward: []

  # Telegram, for listeners: the audio is copied unchanged, and the camera video is replaced by
  # a static picture (assets/telegram.png, 640x360). Tested on real Telegram: plays with the
  # phone screen locked, ~7 s delay. Camera video on Telegram was buffered heavily and stopped
  # when the screen locked.
  # - ffmpeg, not forward: Telegram's ingest closes connections from MediaMTX's native RTMP
  #   client (EOF right after connecting), while ffmpeg with the same URL and key works.
  # - The video track must stay, at 30 fps: without it Telegram tells listeners the channel is
  #   "not broadcasting live stream data"; at 5 fps its player added 30+ s of delay.
  # - movie+loop decodes the PNG once and repeats it, instead of re-reading it every frame;
  #   fps=30 gives clean 30 fps timestamps.
  # - scale=out_color_matrix=bt709:out_range=tv and the -color* flags: FFmpeg 8 (the version in
  #   the mediamtx -ffmpeg image) otherwise tags a PNG-based stream as full-range RGB ("pc, gbr"),
  #   which Telegram can't play (black picture, "not broadcasting", broken audio).
  # - -shortest ends the push when the audio input ends, instead of sending a silent picture.
  # $TELEGRAM_RTMP_URL comes from compose.yaml. Hooks run without a shell, so no quoting is needed.
  telegram:
    runOnOnline: >
      ffmpeg -hide_banner -loglevel warning
      -rw_timeout 10000000 -i rtmp://127.0.0.1:1935/$MTX_PATH
      -f lavfi -i movie=/assets/telegram.png,loop=loop=-1:size=1,fps=30,scale=out_color_matrix=bt709:out_range=tv,format=yuv420p
      -map 1:v -map 0:a
      -c:v libx264 -preset ultrafast -tune stillimage -g 60 -b:v 100k
      -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv
      -c:a copy -shortest
      -rw_timeout 10000000 -f flv $TELEGRAM_RTMP_URL
    runOnOnlineRestart: true

  # Audio archive: copy the AAC track (no re-encoding) into hourly ADTS files.
  # ADTS has no index or trailer, so a power cut costs only the last few seconds.
  # /recordings/stream-audio exists only on the USB stick: if the stick is missing, this
  # hook fails and retries every 5 s, while the platforms are unaffected.
  archive:
    runOnOnline: >
      ffmpeg -hide_banner -loglevel warning
      -i rtmp://127.0.0.1:1935/$MTX_PATH
      -map 0:a -c copy
      -f segment -segment_time 3600 -segment_format adts -reset_timestamps 1 -strftime 1
      /recordings/stream-audio/%Y-%m-%d_%H-%M-%S.aac
    runOnOnlineRestart: true
